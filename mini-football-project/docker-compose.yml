version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: mini-football-db
    environment:
      POSTGRES_USER: minifootball
      POSTGRES_PASSWORD: minifootball_demo_password
      POSTGRES_DB: mini_football
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minifootball"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mini-football-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mini-football-api
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: minifootball
      DB_PASSWORD: minifootball_demo_password
      DB_NAME: mini_football
      JWT_SECRET: your_super_secret_jwt_key_change_in_production
      TIMEZONE: Europe/Nicosia
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - mini-football-network
    command: sh -c "npm run migrate && npm start"

  # Frontend React App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mini-football-frontend
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - mini-football-network

volumes:
  postgres_data:

networks:
  mini-football-network:
    driver: bridge
